# compose プロジェクト名は意図的に固定しない（name: を書かない）。
# 既定の「ディレクトリ名由来」に任せることで、worktree ごとに
# project / コンテナ名 / ネットワーク（<project>_default）が自動的に分かれ、
# dev サーバと E2E を worktree 間で並列に動かせる。
#   本体:     pre-market_trading_frontend
#   worktree: pre-market_trading_frontend-<ブランチ名>
# ネットワーク名を推測して書き込む場所を作らないこと（compose は小文字化と
# 許可外文字の除去を行う）。正は docker compose config の name。
# MCP は scripts/mcp-docker.sh が cwd からネットワーク名を導出する。
services:
  frontend:
    build:
      context: .
      target: dev
    working_dir: /app
    command: npm run dev
    # ホスト公開ポートだけを worktree ごとに変える。コンテナ内は常に 5173 なので、
    # E2E の http://frontend:5173 も vite.config.js の strictPort もそのまま使える。
    # 本体は既定の 5173。worktree の値は scripts/worktree.sh add が .env に書く。
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    volumes:
      # リポジトリ全体をマウントする。docs/ も /app/docs として見えるため、
      # npm run check:scenarios はここからシナリオ文書を読む（別マウントは不要）。
      - .:/app
      # ホスト(Windows)の node_modules とバインドが衝突しないよう named volume で上書きする
      - node_modules:/app/node_modules
    # Vite proxy の既定転送先 host.docker.internal をコンテナから解決させる。
    # Docker Desktop(Windows/macOS) は既定で解決できるが、Linux の Docker Engine では
    # 解決できないため明示する（Desktop 側でもこの指定は無害）。
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # VITE_* は Vite 自身が .env から読み込むため、ここでは渡さない。
    # compose の environment: を併記すると env_file より優先され、
    # .env での切り替え（VITE_ENABLE_MSW など）が効かなくなる。

  # Playwright はブラウザ同梱の公式イメージを使う（alpine では動作しない）
  # イメージのタグと package.json の @playwright/test は必ず同じバージョンに揃えること
  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    command: npx playwright test
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - E2E_BASE_URL=http://frontend:5173
    depends_on:
      - frontend

  # OpenAPI の lint / HTML ドキュメント生成（ホストに Node が無いため公式イメージを使う）
  # run 専用: docker compose run --rm redocly lint openapi.json
  #           docker compose run --rm redocly build-docs openapi.json -o openapi.html
  redocly:
    image: redocly/cli:2.49.0
    working_dir: /spec
    volumes:
      - ./docs/api:/spec
    profiles:
      - tools # `docker compose up` では起動しない

  # バックエンドは別リポジトリ・別サーバ（別メンバ管轄）。
  # ここに backend サービスは追加しない。/api の転送先は .env の VITE_PROXY_TARGET で指定する。
  # 取り決めは README の「バックエンドとの連携」を参照。

volumes:
  # node_modules は全 worktree で共有する（project が分かれても install は 1 回で済む）。
  # external なので docker compose down -v でも消えない＝他 worktree を壊さない。
  # 逆に「共有」の代償として npm install / npm ci / package.json の変更は排他。
  # 無い場合は作る: docker volume create us-stock-order-frontend_node_modules
  # （scripts/worktree.sh add / doctor が存在を確認する）
  node_modules:
    external: true
    name: us-stock-order-frontend_node_modules
