services:
  frontend:
    build:
      context: ./frontend
      target: dev
    working_dir: /app
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # ホスト(Windows)の node_modules とバインドが衝突しないよう named volume で上書きする
      - frontend_node_modules:/app/node_modules
      # E2E シナリオ文書（npm run check:scenarios が読む）
      - ./docs/e2e:/docs/e2e:ro
    # VITE_* は Vite 自身が frontend/.env から読み込むため、ここでは渡さない。
    # compose の environment: を併記すると env_file より優先され、
    # frontend/.env での切り替え（VITE_ENABLE_MSW など）が効かなくなる。

  # Playwright はブラウザ同梱の公式イメージを使う（alpine では動作しない）
  # イメージのタグと frontend/package.json の @playwright/test は必ず同じバージョンに揃えること
  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    command: npx playwright test
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./docs/e2e:/docs/e2e:ro
    environment:
      - E2E_BASE_URL=http://frontend:5173
    depends_on:
      - frontend

  # OpenAPI の lint / HTML ドキュメント生成（ホストに Node が無いため公式イメージを使う）
  # run 専用: docker compose run --rm redocly lint openapi.yaml
  #           docker compose run --rm redocly build-docs openapi.yaml -o openapi.html
  redocly:
    image: redocly/cli:2.49.0
    working_dir: /spec
    volumes:
      - ./docs/api:/spec
    profiles:
      - tools # `docker compose up` では起動しない

  # バックエンドは別メンバ管轄。構成が決まったらここに backend サービスを追加する。
  # frontend の Vite proxy は既に http://backend:8000 を向いている。

volumes:
  frontend_node_modules:
