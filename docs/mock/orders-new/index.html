<script>
function setTradeType(val) {
  document.getElementById('tradeTypeHidden').value = val;
  var form = document.getElementById('fskForm');
  form.classList.remove('theme-buy', 'theme-sell');
  document.getElementById('btnBuy').classList.remove('is-active');
  document.getElementById('btnSell').classList.remove('is-active');
  if (val === '買') { form.classList.add('theme-buy');  document.getElementById('btnBuy').classList.add('is-active'); }
  else if (val === '売') { form.classList.add('theme-sell'); document.getElementById('btnSell').classList.add('is-active'); }
}
function setCustodyType(val) {
  document.getElementById('custodyTradeHidden').value = val;
  ['特定','一般','NISA'].forEach(function(t){
    var btn = document.getElementById('cbtn_' + t);
    if (btn) btn.classList.toggle('is-active', t === val);
  });
}
function setPriceType(val) {
  document.getElementById('orderTypeHidden').value = val;
  document.getElementById('pricebtn_market').classList.toggle('is-active', val === '成行');
  document.getElementById('pricebtn_limit').classList.toggle('is-active', val === '指値');
  var wrap = document.getElementById('limitPriceWrap');
  var input = document.getElementById('limitPriceInput');
  var isLimit = val === '指値';
  wrap.style.display = isLimit ? 'flex' : 'none';
  input.required = isLimit;
  if (!isLimit) input.value = '';
}
function setExecutionMethod(val) {
  document.getElementById('executionMethodHidden').value = val;
  ['通常', 'VWAP'].forEach(function(method) {
    document.getElementById('executionbtn_' + method).classList.toggle('is-active', method === val);
  });
}
function setToggle(hiddenId, btnPrefix, options, val) {
  document.getElementById(hiddenId).value = val;
  options.forEach(function(o){
    var btn = document.getElementById(btnPrefix + o);
    if (btn) btn.classList.toggle('is-active', o === val);
  });
}
function formatQuantityInput(input) {
  var digits = input.value.replace(/[^0-9]/g, '');
  input.value = digits ? Number(digits).toLocaleString('en-US') : '';
}
function formatOrderDateInput(input) {
  var digits = input.value.replace(/[^0-9]/g, '').slice(0, 4);
  input.value = digits.length > 2 ? digits.slice(0, 2) + '/' + digits.slice(2) : digits;
}
function formatOrderTimeInput(input) {
  var digits = input.value.replace(/[^0-9]/g, '').slice(0, 4);
  input.value = digits.length > 2 ? digits.slice(0, 2) + ':' + digits.slice(2) : digits;
}
(function(){
  var v = document.getElementById('tradeTypeHidden').value;
  if (v) setTradeType(v);
  var c = document.getElementById('custodyTradeHidden').value;
  if (c) setCustodyType(c);
  var priceType = document.getElementById('orderTypeHidden').value;
  if (priceType) setPriceType(priceType);
  var executionMethod = document.getElementById('executionMethodHidden').value;
  if (executionMethod) setExecutionMethod(executionMethod);
  // 売買未選択時はデフォルトのis-activeを除去

<script>
  function updateMarketStatus() {
    var el = document.getElementById('market-status');
    if (!el) return;
    var now = new Date();
    var ny = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
    var t = ny.getHours() * 60 + ny.getMinutes();
    var status, color;
    if (t >= 240 && t < 570) { status = '● Pre-Market'; color = '#d97706'; }
    else if (t >= 570 && t < 960) { status = '● Regular'; color = '#059669'; }
    else if (t >= 960 && t < 1200) { status = '● After-Hours'; color = '#7c3aed'; }
    else { status = '○ Closed'; color = '#9ca3af'; }
    el.textContent = status;
    el.style.color = color;
  }
  updateMarketStatus();
  setInterval(updateMarketStatus, 60000);
</script>

<script>
function setTradeType(val) {
  document.getElementById('tradeTypeHidden').value = val;
  var form = document.getElementById('fskForm');
  form.classList.remove('theme-buy', 'theme-sell');
  document.getElementById('btnBuy').classList.remove('is-active');
  document.getElementById('btnSell').classList.remove('is-active');
  if (val === '買') { form.classList.add('theme-buy');  document.getElementById('btnBuy').classList.add('is-active'); }
